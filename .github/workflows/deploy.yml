name: CI/CD - test, build, push, deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # lets GitHub request a short-lived OIDC token for AWS

env:
  APP_IMAGE: ghcr.io/sawera-11/cea-expense-app
  WEB_IMAGE: ghcr.io/sawera-11/cea-expense-web
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::939377868968:role/cea-github-deploy-role
  APP_URL: http://cea-alb-1199528754.us-east-1.elb.amazonaws.com

jobs:
  test:
    name: 1. Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run unit tests
        working-directory: app
        run: npm test

  build-and-push:
    name: 2. Build and push images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest

  deploy:
    name: 3. Deploy to AWS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: "Debug: show OIDC token claims"
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          PAYLOAD=$(echo "$RESP" | jq -r .value | cut -d. -f2)
          python3 - "$PAYLOAD" <<'EOF'
          import sys, base64, json
          p = sys.argv[1]; p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ["sub", "aud", "iss", "repository", "repository_owner", "ref", "environment"]:
              print(f"{k}: {c.get(k)}")
          EOF

      - name: Get temporary AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy.sh on every app server via SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=cea-app-server" \
            --parameters "commands=['/opt/cea/deploy.sh ${{ github.sha }}']" \
            --comment "Deploy ${{ github.sha }}" \
            --query Command.CommandId --output text)
          echo "SSM command ID: $CMD_ID"

          for i in $(seq 1 36); do
            sleep 10
            STATUSES=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query "CommandInvocations[].Status" --output text)
            echo "Attempt $i: $STATUSES"
            if [ -n "$STATUSES" ] && ! echo "$STATUSES" | grep -qE "Pending|InProgress|Delayed"; then
              break
            fi
          done

          aws ssm list-command-invocations --command-id "$CMD_ID" --details \
            --query "CommandInvocations[].{Instance:InstanceId,Status:Status,Output:CommandPlugins[0].Output}" \
            --output table

          if echo "$STATUSES" | grep -vqE "^(Success[[:space:]]*)+$"; then
            echo "Deployment failed on at least one server"
            exit 1
          fi

      - name: Smoke test through the load balancer
        run: |
          sleep 15
          curl --fail --silent --show-error "$APP_URL/api/health"
          echo
          echo "Live at $APP_URL"
